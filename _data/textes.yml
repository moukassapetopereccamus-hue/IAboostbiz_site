# ==========================================================================
#  TOUS LES TEXTES DU SITE IAboostbiz
# ==========================================================================
#  C'est le SEUL fichier à ouvrir pour changer un texte du site.
#
#  Comment écrire :
#  - Le texte se trouve toujours SOUS une ligne qui finit par « >- ».
#  - Gardez le même décalage (les espaces au début de la ligne) que le texte
#    que vous remplacez. Ne mettez jamais de tabulation.
#  - Vous pouvez écrire le texte sur une ou plusieurs lignes : le site le
#    remet sur une seule ligne tout seul.
#  - Ne changez pas les mots placés AVANT les deux-points (titre:, texte:,
#    rythme:…) : ce sont des étiquettes que le site utilise pour s'y retrouver.
#  - Les lignes qui commencent par # sont des explications : elles ne
#    s'affichent pas sur le site.
# ==========================================================================


# --------------------------------------------------------------------------
#  COORDONNÉES
# --------------------------------------------------------------------------
contact:

  # Numéro WhatsApp pour les boutons : chiffres seulement, sans + ni espaces.
  # Au Congo-Brazzaville, on GARDE le 0 : +242 05 314 27 28 s'écrit 242053142728.
  whatsapp_numero: >-
    242053142728

  # Le même numéro, écrit comme il doit s'afficher en bas de la page.
  whatsapp_affiche: >-
    +242 05 314 27 28

  # Le message déjà écrit quand le visiteur clique sur un bouton.
  # Écrivez-le normalement, avec accents et espaces : le site s'occupe du reste.
  whatsapp_message: >-
    Bonjour, je souhaite un diagnostic gratuit pour mon activité.

  # Adresse e-mail affichée en bas de la page.
  email: >-
    moukassapetopereccamus@gmail.com


# --------------------------------------------------------------------------
#  LE BOUTON (le même texte partout : en-tête, accroche, services, bandeau)
# --------------------------------------------------------------------------
bouton:
  texte: >-
    Diagnostic gratuit sur WhatsApp
  # Version courte, affichée dans l'en-tête sur les petits téléphones.
  texte_court: >-
    Diagnostic gratuit
  # Petite phrase sous le bouton.
  precision: >-
    C'est gratuit et ça ne vous engage à rien. On est à Brazzaville.


# --------------------------------------------------------------------------
#  GOOGLE ET APERÇU WHATSAPP (ne s'affichent pas sur la page)
# --------------------------------------------------------------------------
referencement:
  # Titre dans Google et dans l'onglet : 60 caractères maximum, garder « Brazzaville ».
  titre: >-
    IAboostbiz à Brazzaville, on vous prévient sur WhatsApp
  # Résumé dans Google et dans l'aperçu WhatsApp : 155 caractères maximum.
  description: >-
    On garde un œil sur vos concurrents et sur vos mails, et on vous
    prévient sur WhatsApp. Diagnostic gratuit de 15 minutes, à
    Brazzaville.


# --------------------------------------------------------------------------
#  1. ACCROCHE (le haut de la page)
# --------------------------------------------------------------------------
accroche:
  # La grande phrase. Elle sert aussi de titre dans l'aperçu WhatsApp.
  titre: >-
    Votre business tourne même quand vous n'êtes pas disponible.
  sous_titre: >-
    Pendant que vous êtes avec vos clients, on regarde ce que font vos
    concurrents et on lit vos mails pour vous. Quand quelque chose
    compte, vous le recevez sur WhatsApp.


# --------------------------------------------------------------------------
#  LE TÉLÉPHONE D'EXEMPLE (à côté de la grande phrase)
#  Ce sont des EXEMPLES, pas de vrais messages : l'étiquette doit le dire.
# --------------------------------------------------------------------------
telephone:
  # L'animation (l'heure qui avance, les messages qui se poussent) est réglée
  # pour 3 messages : gardez-en 3. Les heures affichées viennent des messages.
  etiquette: >-
    Exemple d'un lundi matin sur votre téléphone
  jour: >-
    Lundi
  heure: >-
    07:30
  messages:
    - heure: >-
        07:30
      titre: >-
        Vos concurrents cette semaine
      texte: >-
        Le concurrent A fait une promo jusqu'à samedi. Deux clients
        se plaignent de l'attente chez lui.
    - heure: >-
        07:31
      titre: >-
        Mail important
      texte: >-
        Facture du fournisseur reçue par mail. À régler avant
        vendredi.
    - heure: >-
        07:32
      titre: >-
        Votre semaine
      texte: >-
        Samedi a été votre meilleur jour. Pensez à recommander du
        savon.


# --------------------------------------------------------------------------
#  2. LE PROBLÈME : trois situations vécues
# --------------------------------------------------------------------------
probleme:
  titre: >-
    Ce qui vous fait perdre du temps
  situations:
    - titre: >-
        La promo d'en face, vous l'apprenez trop tard.
      texte: >-
        C'est un client qui vous le dit, à la caisse. La pharmacie
        d'en face fait une promo depuis dix jours, et vous n'en
        saviez rien.
    - titre: >-
        Une commande perdue dans les mails.
      texte: >-
        Un client a commandé par mail mardi. Vous l'avez vu jeudi,
        parce que vous êtes sur WhatsApp toute la journée. Il a
        acheté ailleurs.
    - titre: >-
        Le dimanche soir sur les comptes.
      texte: >-
        Pour savoir comment s'est passée la semaine, vous reprenez
        le cahier et vous relisez les messages un par un. Ça prend
        des heures.
  # Petite invitation sous les situations (lien vers WhatsApp).
  mini_cta: >-
    Ça vous arrive aussi ? On en parle sur WhatsApp


# --------------------------------------------------------------------------
#  3. LA SOLUTION : trois lignes maximum
# --------------------------------------------------------------------------
solution:
  titre: >-
    Ce qu'on fait pour vous
  lignes:
    - >-
      On regarde à votre place ce qui se passe chez vos concurrents et
      dans votre boîte mail.
    - >-
      Dès qu'il y a quelque chose d'important, on vous l'envoie sur
      WhatsApp ou Telegram.
    - >-
      Vous, vous restez avec vos clients.


# --------------------------------------------------------------------------
#  4. LES SERVICES
#  Pour ajouter un service : copiez un bloc complet (de « - rythme » jusqu'à
#  « exemple_heure ») et collez-le à la suite, avec le même décalage.
#  icone : « calendrier » (rythme fixe) ou « cloche » (dès que ça arrive).
# --------------------------------------------------------------------------
services:
  titre: >-
    Ce qu'on vous envoie, et quand
  liste:
    - rythme: >-
        Chaque lundi matin
      icone: calendrier
      nom: >-
        Veille concurrentielle
      description: >-
        On suit les publications et les avis Google de vos
        concurrents. Vous recevez une page qui dit ce qui a changé
        chez eux, et ce que vous pourriez faire.
      exemple: >-
        Le concurrent B a fait trois promos cette semaine, surtout
        sur les pagnes. Ses clients se plaignent de l'accueil sur
        Google. Vous pourriez mettre en avant votre retouche
        offerte.
      exemple_heure: >-
        Lundi 07:30

    - rythme: >-
        Dès que ça arrive
      icone: cloche
      nom: >-
        Alertes importantes
      description: >-
        Quand un mail important arrive, une commande ou une facture
        par exemple, on vous l'envoie tout de suite sur WhatsApp ou
        Telegram. Les autres restent dans votre boîte.
      exemple: >-
        Nouvelle commande par mail. 20 cartons d'eau minérale, à
        livrer jeudi.
      exemple_heure: >-
        Mardi 10:14

    - rythme: >-
        Chaque lundi
      icone: calendrier
      nom: >-
        Rapport de la semaine
      description: >-
        Une page avec vos chiffres de la semaine passée. Ça se lit
        en deux minutes.
      exemple: >-
        La semaine passée, samedi a été votre meilleur jour. Trois
        rendez-vous ont été annulés et le stock de savon baisse.
      exemple_heure: >-
        Lundi 07:32

  # Phrase sous le dessin de la semaine.
  semaine_legende: >-
    Exemple de semaine. Le lundi, c'est fixe. Les alertes, elles,
    partent quand un mail important arrive.
  # Mention au-dessus de chaque exemple.
  etiquette_exemple: >-
    Exemple de message
  # La ligne sous les services. « sur_demande_debut » s'affiche en gras devant
  # (laissez-le vide pour ne rien mettre en gras).
  sur_demande_debut: >-
  sur_demande: >-
    On peut aussi envoyer les rappels de rendez-vous et les
    confirmations de commande, si vous en avez besoin.


# --------------------------------------------------------------------------
#  4 bis. BIENTÔT : WHATSAPP QUI RÉPOND POUR VOUS
#  Service à venir. Les conditions sont celles de Meta (propriétaire de
#  WhatsApp) : ne pas les promettre plus souples qu'elles ne sont.
# --------------------------------------------------------------------------
bientot:
  # Petite étiquette bleue au-dessus du titre.
  etiquette: >-
    Bientôt
  titre: >-
    Votre WhatsApp qui répond pour vous
  texte: >-
    Votre numéro WhatsApp pro répond aux questions qu'on vous pose tous
    les jours, même quand vous êtes occupé. On y travaille.
  conditions_titre: >-
    Pour les entreprises déjà installées
  conditions_intro: >-
    WhatsApp appartient à Meta, et c'est Meta qui décide qui y a droit.
    En général, elle demande :
  conditions:
    - >-
      une entreprise immatriculée, avec son RCCM ;
    - >-
      un site internet ou une page professionnelle sérieuse, au nom de
      l'entreprise ;
    - >-
      une adresse et un numéro de téléphone professionnels.
  conclusion: >-
    Il vous manque quelque chose ? On vous le dit pendant le diagnostic,
    avant que vous payiez quoi que ce soit.


# --------------------------------------------------------------------------
#  4 ter. NOTRE RÈGLE : ON FAIT LE CALCUL AVANT
#  Ce que le diagnostic mesure avant toute proposition. Pas de chiffres ici :
#  les chiffres viennent du client, pendant le diagnostic.
# --------------------------------------------------------------------------
regle:
  titre: >-
    On fait le calcul avant
  texte: >-
    On regarde avec vous ce que ça peut vous rapporter, avec vos
    chiffres à vous. C'est seulement après qu'on vous propose quelque
    chose.
  mesures_titre: >-
    Pendant le diagnostic, on regarde
  mesures:
    - titre: >-
        Vos demandes
      texte: >-
        Combien de messages, d'appels ou de commandes vous recevez par jour.
    - titre: >-
        Ce qui vous échappe
      texte: >-
        Les messages restés sans réponse, et les clients partis
        ailleurs.
    - titre: >-
        La valeur d'une vente
      texte: >-
        Ce que vous rapporte en moyenne un client ou une visite.
    - titre: >-
        Votre temps
      texte: >-
        Les heures passées chaque jour à répondre aux messages et à
        faire les comptes.
  prudence: >-
    On ne vous promet pas de récupérer toutes les ventes perdues.
    Seulement une partie, et on compte large.
  decision: >-
    Si ce que vous gagnez ne paie pas clairement ce que ça coûte, on
    vous le dit. Et on ne lance rien.


# --------------------------------------------------------------------------
#  5. COMMENT ÇA SE PASSE : les étapes
#  « important » est la phrase mise en gras à la fin (laisser vide si aucune).
# --------------------------------------------------------------------------
etapes:
  titre: >-
    Comment on travaille ensemble
  liste:
    - titre: >-
        Un diagnostic gratuit de 15 minutes sur WhatsApp
      texte: >-
        Vous nous expliquez votre activité et ce qui vous prend du
        temps. On écoute d'abord, on propose après. Et si on ne peut
        pas vous aider, on vous le dit.
      important: >-
    - titre: >-
        On vous montre avant de lancer
      texte: >-
        Vous recevez un devis en FCFA avant qu'on commence. On vous
        montre un exemple de ce que vous allez recevoir, et on ne
        lance rien sans votre accord.
      important: >-
    - titre: >-
        Ensuite, ça arrive sur votre téléphone
      texte: >-
        Sur WhatsApp ou Telegram, aux jours prévus. Il n'y a rien à
        installer.
      important: >-


# --------------------------------------------------------------------------
#  6. CONFIANCE
#  icone possible : epingle, personnes, billet, valide, texte
# --------------------------------------------------------------------------
confiance:
  titre: >-
    Pourquoi travailler avec nous
  liste:
    - icone: epingle
      titre: >-
        On est à Brazzaville
      texte: >-
        IAboostbiz, c'est Moukassa Perec. Vous savez à qui vous
        parlez, et où le trouver.
    - icone: personnes
      titre: >-
        On peut se voir
      texte: >-
        Si vous préférez parler en face, on passe à votre commerce
        ou à votre cabinet.
    - icone: billet
      titre: >-
        Le prix, vous le connaissez avant
      texte: >-
        Le devis est en FCFA et vous l'avez avant qu'on commence.
        Pas de mauvaise surprise.
    - icone: valide
      titre: >-
        Rien ne démarre sans votre accord
      texte: >-
        Vous voyez d'abord ce que vous allez recevoir. Si ça ne vous
        convient pas, on ajuste.
    - icone: texte
      titre: >-
        Pas de jargon
      texte: >-
        On vous parle de vos clients et de vos ventes. Pas de
        technique.


# --------------------------------------------------------------------------
#  7. TÉMOIGNAGES
#  Uniquement de VRAIS clients, avec leur accord, avec leurs mots exacts.
#  Tant que la liste est vide (deux crochets [ ]), la section n'apparaît pas.
#  Pour en ajouter un, remplacez la ligne de la liste vide, plus bas, par :
#
#  liste:
#    - texte: >-
#        Les mots exacts du client.
#      auteur: >-
#        Grâce M., pharmacie, Poto-Poto
# --------------------------------------------------------------------------
temoignages:
  titre: >-
    Ce qu'en disent nos clients
  liste: []


# --------------------------------------------------------------------------
#  8. BANDEAU FINAL (le bloc bleu nuit en bas)
# --------------------------------------------------------------------------
bandeau:
  titre: >-
    On commence par 15 minutes sur WhatsApp
  texte: >-
    Vous nous dites ce qui vous prend du temps. À la fin, vous saurez si
    on peut vous aider ou pas.


# --------------------------------------------------------------------------
#  9. PIED DE PAGE (l'année se met à jour toute seule)
# --------------------------------------------------------------------------
pied:
  lieu: >-
    Brazzaville, République du Congo
